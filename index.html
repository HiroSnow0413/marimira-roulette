<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>マリミラルーレット</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="src/styles.css" rel="stylesheet">
</head>

<body class="py-4">

    <div class="container text-center">
        <h1 id="page-title" class="display-6 fw-bold mb-2" style="color: #3385ff;">マリミラルーレット</h1>

        <p class="notice mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <span>運営 or メンバーの前で回してください</span>
        </p>

        <div class="roulette-wrapper">
            <div class="indicator"></div>
            <svg id="wheel-svg" viewBox="0 0 100 100">
                <g id="wheel-group">
                    <circle cx="50" cy="50" r="50" fill="#e9ecef"/>
                    <text x="50" y="50" text-anchor="middle" fill="#adb5bd" style="font-size: 5px; font-weight: bold;">読込中...</text>
                </g>
            </svg>
        </div>

        <div class="mt-4 px-3">
            <button id="spin-btn" class="btn btn-primary btn-spin" onclick="spin()" disabled>読み込み中...</button>
        </div>
    </div>

    <div class="modal fade" id="resultModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-warning text-dark justify-content-center">
                    <h5 class="modal-title fw-bold">当たり！</h5>
                </div>
                <div class="modal-body py-4 text-center">
                    <div id="hit-item" class="hit-item-display"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary px-4 py-2 rounded-pill fw-bold"
                        onclick="closeAndSpin()">もう一度回す</button>
                    <button type="button" class="btn btn-outline-secondary px-4 py-2 rounded-pill"
                        onclick="closeModal()">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
